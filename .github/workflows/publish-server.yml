name: publish-server

# Publishes fleetwrit-server (built from ./server) to PyPI on a published
# GitHub Release, via Trusted Publishing (OIDC — no stored token).
# One-time PyPI setup: add a Trusted Publisher for project `fleetwrit-server`
# with owner=teopopescu, repo=fleetwrit, workflow=publish-server.yml, env=pypi.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build server --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-server
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-server
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
