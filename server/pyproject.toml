[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fleetwrit-server"
version = "0.0.1"
description = "Fleetwrit v0 local server (fleetwrit dev): FastAPI + SQLite."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
  "fleetwrit>=0.0.1",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "cryptography>=42",
]

[project.scripts]
fleetwrit-server = "fleetwrit_server.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["fleetwrit_server"]

[tool.hatch.build.targets.wheel.force-include]
"fleetwrit_server/schema.sql" = "fleetwrit_server/schema.sql"
